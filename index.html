<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <!-- Greeting Section -->
        <header class="greeting-card">
            <h1 id="greeting-text">Loading...</h1>
            <p id="current-time" class="clock">--:--</p>
            <p id="current-date" class="date"></p>
            <div class="name-input-group">
                <input type="text" id="name-input" placeholder="Enter your name..." maxlength="30">
                <button id="save-name-btn" class="btn btn-small">Save Name</button>
            </div>
            <p id="name-hint" class="hint"></p>
        </header>

        <main class="widgets">
            <!-- Focus Timer -->
            <section class="card timer-card">
                <h2 class="card-title">Focus Timer</h2>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button id="timer-start" class="btn btn-start">Start</button>
                    <button id="timer-stop" class="btn btn-stop" disabled>Stop</button>
                    <button id="timer-reset" class="btn btn-reset">Reset</button>
                </div>
                <p class="hint" id="timer-status">Ready to focus</p>
            </section>

            <!-- To-Do List -->
            <section class="card todo-card">
                <h2 class="card-title">To-Do List</h2>
                <div class="todo-input-group">
                    <input type="text" id="todo-input" placeholder="Add a new task..." maxlength="100">
                    <button id="todo-add-btn" class="btn btn-small">Add</button>
                </div>
                <p id="todo-feedback" class="hint feedback"></p>
                <div class="todo-sort-group">
                    <label for="todo-sort">Sort by:</label>
                    <select id="todo-sort">
                        <option value="created">Date added</option>
                        <option value="alpha">Alphabetical (A–Z)</option>
                        <option value="status">Status (incomplete first)</option>
                    </select>
                </div>
                <ul id="todo-list" class="todo-list"></ul>
                <p id="todo-empty" class="hint empty-hint">No tasks yet. Add one above!</p>
            </section>

            <!-- Quick Links -->
            <section class="card links-card">
                <h2 class="card-title">Quick Links</h2>
                <div class="link-input-group">
                    <input type="text" id="link-name" placeholder="Name (e.g. GitHub)" maxlength="40">
                    <input type="text" id="link-url" placeholder="https://example.com" maxlength="200">
                    <button id="link-add-btn" class="btn btn-small">Add Link</button>
                </div>
                <p id="link-feedback" class="hint feedback"></p>
                <div id="quick-links" class="quick-links"></div>
                <p id="links-empty" class="hint empty-hint">No links saved yet.</p>
            </section>
        </main>

        <footer class="footer">
            <p>Your data is saved locally in your browser.</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
